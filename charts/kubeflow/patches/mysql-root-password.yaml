##
# Give KFP's MySQL a password.
#
# Upstream runs it with `MYSQL_ALLOW_EMPTY_PASSWORD: "true"` and a `mysql-secret`
# holding `username: root` / `password: ""` — an unauthenticated database
# reachable from anything that can resolve `mysql` in this namespace. §14 rules
# that out, and it costs one env var to fix: bootstrap-secrets.sh generates the
# value, this mounts it as `MYSQL_ROOT_PASSWORD`, and the API server already
# reads the same secret for its own connection.
#
# `MYSQL_ALLOW_EMPTY_PASSWORD` is deleted rather than set to "false": the mysql
# entrypoint tests these variables with `-z`, so *any* value including "false"
# still counts as permission. Removing it is the only way to withdraw it.
#
# Only applies to a fresh volume. The mysql image initialises the root password
# once, when the data directory is empty, so changing it on an existing install
# means deleting mysql-pv-claim — the same constraint bootstrap-secrets.sh
# already documents for Airflow's Postgres, and the reason it reuses an existing
# password instead of rotating.
##
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
spec:
  template:
    spec:
      containers:
        - name: mysql
          env:
            - name: MYSQL_ALLOW_EMPTY_PASSWORD
              $patch: delete
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: password
