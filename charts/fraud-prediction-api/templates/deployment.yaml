apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-prediction-api
  labels:
    app.kubernetes.io/name: fraud-prediction-api
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: fraud-prediction-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fraud-prediction-api
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: MODEL_NAME
              value: {{ .Values.model.name | quote }}
            - name: MODEL_VERSION
              value: {{ .Values.model.version | quote }}
            - name: FRAUD_THRESHOLD
              value: {{ .Values.model.threshold | quote }}
            - name: KSERVE_PREDICT_URL
              value: {{ .Values.model.kservePredictUrl | quote }}
            - name: FEAST_REPO_PATH
              value: /feature_store
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
{{ toYaml .Values.resources | indent 12 }}
