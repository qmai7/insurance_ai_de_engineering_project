# The TaskManager finds the JobManager through this name, and the SQL client
# submits to its REST port. Port-forward 8081 for the Flink UI.
apiVersion: v1
kind: Service
metadata:
  name: flink-jobmanager
  labels:
    app: flink
    component: jobmanager
spec:
  type: ClusterIP
  selector:
    app: flink
    component: jobmanager
  ports:
    - name: rpc
      port: 6123
      targetPort: rpc
    - name: blob
      port: 6124
      targetPort: blob
    - name: ui
      port: 8081
      targetPort: ui
