apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# KServe publishes versioned manifests rather than a Helm chart. Keep this
# overlay pinned and put all namespaced KServe control-plane resources in the
# project's locked kserve-ns namespace.
namespace: kserve-ns

resources:
  - https://raw.githubusercontent.com/kserve/kserve/v0.15.2/install/v0.15.2/kserve.yaml
  - https://raw.githubusercontent.com/kserve/kserve/v0.15.2/install/v0.15.2/kserve-cluster-resources.yaml
  - inference-service.yaml

patches:
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Namespace
      metadata:
        name: kserve
  - target:
      kind: CustomResourceDefinition
      name: (inferenceservices|clusterservingruntimes|clusterstoragecontainers|inferencegraphs|localmodelcaches|localmodelnodes|localmodelnodegroups)\.serving\.kserve\.io
    patch: |-
      - op: replace
        path: /metadata/annotations/cert-manager.io~1inject-ca-from
        value: kserve-ns/serving-cert
  - target:
      kind: MutatingWebhookConfiguration
      name: inferenceservice.serving.kserve.io
    patch: |-
      - op: replace
        path: /metadata/annotations/cert-manager.io~1inject-ca-from
        value: kserve-ns/serving-cert
  - target:
      kind: ValidatingWebhookConfiguration
      name: (clusterservingruntime|inferencegraph|inferenceservice|localmodelcache|servingruntime|trainedmodel)\.serving\.kserve\.io
    patch: |-
      - op: replace
        path: /metadata/annotations/cert-manager.io~1inject-ca-from
        value: kserve-ns/serving-cert
  - target:
      kind: Deployment
      name: kserve-localmodel-controller-manager
    patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: kserve-localmodel-controller-manager
  - target:
      kind: DaemonSet
      name: kserve-localmodelnode-agent
    patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: DaemonSet
      metadata:
        name: kserve-localmodelnode-agent
  - target:
      kind: Certificate
      name: serving-cert
    patch: |-
      - op: replace
        path: /spec/commonName
        value: kserve-webhook-server-service.kserve-ns.svc
      - op: replace
        path: /spec/dnsNames/0
        value: kserve-webhook-server-service.kserve-ns.svc
