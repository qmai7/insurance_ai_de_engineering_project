##
# KServe control plane + fraud-detector InferenceService.
# This Application is separate from the FastAPI API because KServe owns
# cluster-scoped CRDs/controllers while the model service is namespaced.
##
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kserve
  namespace: argocd-ns
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:qmai7/insurance_ai_de_engineering_project.git
    targetRevision: main_empty
    path: charts/kserve
  destination:
    server: https://kubernetes.default.svc
    namespace: kserve-ns
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
