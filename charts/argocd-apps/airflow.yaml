##
# airflow — batch orchestration, data-ns. Multi-source Application: the chart
# itself comes from the upstream apache-airflow repo (no chart is vendored
# here, same reasoning as charts/kubeflow's kustomize overlay), and this
# repo supplies only the values file layered on top via the `$values` ref.
##
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: airflow
  namespace: argocd-ns
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://airflow.apache.org
      chart: airflow
      targetRevision: 1.15.0
      helm:
        valueFiles:
          - $values/charts/airflow/values.yaml
    - repoURL: git@github.com:qmai7/insurance_ai_de_engineering_project.git
      targetRevision: main_empty
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: data-ns
  syncPolicy:
    automated:
      prune: true
      # selfHeal off, deliberately: the chart's create-user/migrations Jobs set
      # ttlSecondsAfterFinished: 300, so Kubernetes deletes them 5 minutes after
      # they complete. With selfHeal on, Argo CD reads that as drift and
      # recreates them — an infinite reappear/complete/expire loop. Without it,
      # the app can sit OutOfSync on that one harmless diff; a real change (new
      # image tag, values edit) still triggers a full sync as normal.
      selfHeal: false
    syncOptions:
      - CreateNamespace=true
