##
# Training Pipeline CI — lint, (placeholder) test, build+push, bump+recompile.
#
# Same 4-job chain as airflow-pipelines.yml
#
# Triggers on ml/**, but only the files that are actually hand-authored —
# never ml/pipeline.py or ml/pipeline.yaml, which is exactly what
# update-manifest commits to. Listing "ml/**" broadly and excluding those two
# would need paths-ignore, which GitHub Actions can't combine with paths: on
# the same trigger, so the safe list is spelled out explicitly instead.
#
# Deployment target is different from the Airflow pipeline, on purpose: a KFP
# run is a one-shot API call, not a standing Kubernetes resource, so there is
# nothing for Argo CD to reconcile here. This workflow's job ends at "image
# pushed, pipeline.yaml recompiled and committed" — submitting the run is
# still a separate, manual (or drift-DAG-triggered, per §12) step. See
# docs/cicd.md.
##
name: Training pipeline

on:
  push:
    branches: [main_empty]
    paths:
      - "ml/config.py"
      - "ml/gate.py"
      - "ml/promote.py"
      - "ml/repositories.py"
      - "ml/services.py"
      - "ml/submit.py"
      - "ml/train.py"
      - "ml/training-job.yaml"
      - "docker_image/dockerfile.training"
      - ".github/workflows/training-pipeline.yml"

permissions:
  contents: write
  id-token: write

env:
  REGION: northamerica-northeast1
  PROJECT_ID: aide-playground
  REPOSITORY: insurance-images
  IMAGE: training
  # Safe to commit — see the identical note in airflow-pipelines.yml.
  WORKLOAD_IDENTITY_PROVIDER: projects/722739395224/locations/global/workloadIdentityPools/insurance-github/providers/github
  SERVICE_ACCOUNT: insurance-github-ci@aide-playground.iam.gserviceaccount.com

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          pip install ruff
          ruff check ml/

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          pip install pytest
          pytest ml/ -q || [ $? -eq 5 ]  # 5 = no tests collected yet

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.build.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push
        id: build
        run: |
          TAG="${GITHUB_SHA::12}"
          IMAGE_URI="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${TAG}"
          docker build -t "$IMAGE_URI" -f docker_image/dockerfile.training .
          docker push "$IMAGE_URI"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

  update-manifest:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # kfp only — the compiler is a build-time tool, not a runtime dependency
      # of the training image itself (see docker_image/dockerfile.training).
      - run: pip install "kfp==2.17.0"

      - name: Bump TRAINING_IMAGE and recompile pipeline.yaml
        run: |
          TAG="${{ needs.build-and-push.outputs.tag }}"
          IMAGE_URI="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${TAG}"
          sed -i "s#insurance-images/training:[^\"]*#insurance-images/training:${TAG}#" ml/pipeline.py
          python -m ml.pipeline
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ml/pipeline.py ml/pipeline.yaml
          git commit -m "ci: bump training image to ${TAG}, recompile pipeline.yaml" || exit 0
          git push
