##
# model-server CI — the same 4-job chain as fraud-prediction-api.yml.
#
# Its own workflow rather than a job inside the API's: the two are separate
# images with disjoint dependency stacks (feast+gcsfs vs mlflow+sklearn), and
# a §13 traffic ramp is a change to charts/model-server/values.yaml that must
# not rebuild or redeploy the API. Touching one component never rebuilds
# another is the rule the whole of docs/cicd.md follows.
#
# Note what is *not* in the trigger list: nothing under charts/. A weight change
# is a git commit Argo CD reconciles directly — there is no image to build, so
# running this workflow for it would only produce an identical image under a new
# tag and a pointless rollout of both model-server Deployments mid-ramp.
##
name: Model server

on:
  push:
    branches: [main_empty]
    paths:
      - "model_server/**"
      - "tests/test_model_server.py"
      - "docker_image/dockerfile.model_server"
      - ".github/workflows/model-server.yml"

permissions:
  contents: write
  id-token: write

env:
  REGION: northamerica-northeast1
  PROJECT_ID: aide-playground
  REPOSITORY: insurance-images
  IMAGE: model-server
  WORKLOAD_IDENTITY_PROVIDER: projects/722739395224/locations/global/workloadIdentityPools/insurance-github/providers/github
  SERVICE_ACCOUNT: insurance-github-ci@aide-playground.iam.gserviceaccount.com

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check model_server/

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # No mlflow, no GCS, no sklearn model. The tests substitute a stub
      # ModelLoader for the real one (§15's repository seam), so the whole HTTP
      # surface and every scoring path is covered without the ML stack — which
      # is what keeps this job seconds rather than minutes.
      #
      # pytest-asyncio is not optional: the async tests carry
      # @pytest.mark.asyncio and pytest silently skips them without it, so the
      # job would pass while testing nothing.
      - run: pip install pytest pytest-asyncio httpx fastapi pandas numpy
      - run: pytest tests/test_model_server.py -q

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.build.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet
      - id: build
        run: |
          TAG="${GITHUB_SHA::12}"
          IMAGE_URI="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${TAG}"
          docker build -t "$IMAGE_URI" -f docker_image/dockerfile.model_server .
          docker push "$IMAGE_URI"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

  update-manifest:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump model-server image tag
        run: |
          TAG="${{ needs.build-and-push.outputs.tag }}"
          # Anchored to the first `tag:` in the file, which is image.tag. The
          # `0,/re/s//` form substitutes only the first match — the chart has
          # other keys whose values are quoted strings.
          sed -i "0,/tag: \"[^\"]*\"/s//tag: \"${TAG}\"/" charts/model-server/values.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add charts/model-server/values.yaml
          git commit -m "ci: bump model-server to ${TAG}" || exit 0
          git push
